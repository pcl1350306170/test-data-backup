<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病房 web 开发辅助工具 - 配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .img-config-row {
            display: flex;
            gap: 15px;
        }

        .img-config-item {
            flex: 1;
        }

        .img-config-item label {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏥 病房 web 开发辅助工具</h1>
    <p class="subtitle">配置工具生效端口和按钮外观</p>

    <form id="configForm">
        <div class="form-group">
            <label for="debugPort">生效端口（检测的页面端口）</label>
            <input type="number" id="debugPort" required min="1" max="65535">
            <p class="help-text">只有访问这个端口的页面才会显示工具菜单</p>
        </div>

        <div class="form-group">
            <label>按钮自定义图片（支持远程URL）</label>
            <div class="img-config-row">
                <div class="img-config-item">
                    <label for="btnImageCollapsed">收缩态图片（未展开时显示）</label>
                    <input type="text" id="btnImageCollapsed" placeholder="留空使用默认绿色按钮">
                </div>
                <div class="img-config-item">
                    <label for="btnImageExpanded">展开态图片（菜单展开时显示）</label>
                    <input type="text" id="btnImageExpanded" placeholder="留空使用默认绿色按钮">
                </div>
            </div>
            <p class="help-text">填写图片URL（支持远程链接），留空则使用默认绿色按钮</p>
        </div>

        <div class="form-group">
            <label for="autoCollapseTimeout">菜单自动收起时间（秒）</label>
            <input type="number" id="autoCollapseTimeout" min="0" max="300" step="1">
            <p class="help-text">展开菜单后多少秒自动收起，填 0 表示不自动收起</p>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-primary">保存配置</button>
            <button type="button" id="resetBtn" class="btn-secondary">恢复默认</button>
        </div>

        <div id="message" class="message"></div>
    </form>
</div>

<script src="storage.js"></script>
<script src="options.js"></script>
</body>
</html>
