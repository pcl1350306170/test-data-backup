<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>本地 AI 写作站</title>
<style>
:root{--paper:#f6f1e3;--paper2:#fffdf5;--ink:#2b2a26;--soft:#6b675c;--line:#ddd5c2;--accent:#a3352b;--ok:#3d7a4f;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:860px;padding:24px 16px;flex:1;}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--ink);padding:18px 4px 14px;margin-bottom:28px;}
h1{font-size:24px;letter-spacing:4px;}
.sub{font-size:13px;color:var(--soft);}
.status{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block;}
.dot.ok{background:var(--ok);}.dot.bad{background:#b03a2e;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:640px){.grid{grid-template-columns:1fr;}}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s;}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1);}
.card .icon{font-size:34px;}
.card h2{font-size:19px;letter-spacing:2px;}
.card p{font-size:13.5px;color:var(--soft);flex:1;}
.card .go{font-size:14px;color:var(--accent);font-weight:bold;}
.card.task{border-top:4px solid var(--accent);}
.card.chat{border-top:4px solid #3d7a4f;}
footer{font-size:12px;color:var(--soft);text-align:center;padding:18px 0 26px;}
@media (prefers-color-scheme: dark){
:root{--paper:#1c1a16;--paper2:#26231e;--ink:#e8e1d0;--ink-soft:#a39a88;--soft:#a39a88;--line:#3d392f;--accent:#d0685a;--accent-soft:#3a2a26;--ok:#6fae83;--bad:#e07060;--warn:#c8a24a;}
select,textarea,input,.back,.modal .box{background:#2c2923;color:var(--ink);}
button{background:#3a352c;color:var(--ink);}
button.primary{background:var(--accent);color:#fff;}
.card{box-shadow:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>本地 AI 写作站</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测中…</span></div>
  </header>
  <div class="grid">
    <a class="card task" href="/console">
      <div class="icon">📖</div>
      <h2>小说任务台</h2>
      <p>自动生成大纲 → 逐章写作 → 暂停/续写/断点恢复，适合长篇连载。章节自动保存到本地，可下载全本。</p>
      <div class="go">进入 →</div>
    </a>
    <a class="card chat" href="/chat">
      <div class="icon">💬</div>
      <h2>AI 聊天写作</h2>
      <p>对话式生成：随手写开篇、练一段对白、续写灵感，流式实时输出。可切换模型、调参数。</p>
      <div class="go">进入 →</div>
    </a>
  </div>
</div>
<footer>数据完全在本机运行 · 局域网访问：本机IP:8000 · 模型 <span id="modelName">…</span></footer>
<script>
const $=id=>document.getElementById(id);
fetch('/api/health').then(r=>r.json()).then(h=>{
  $('dot').className='dot '+(h.ollama_online?'ok':'bad');
  $('statusText').textContent = h.ollama_online ? '服务正常' : '⚠ Ollama 未运行';
  $('modelName').textContent = h.model || '';
}).catch(()=>{ $('dot').className='dot bad'; $('statusText').textContent='服务不可用'; });
</script>
</body>
</html>
